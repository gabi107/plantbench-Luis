repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^studies/.*/results/
      - id: end-of-file-fixer
        exclude: ^studies/.*/results/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      - id: no-generated-data
        name: refuse generated data (data/, *.npz, *.pkl)
        entry: generated data is regenerated from its specification, not committed
        language: fail
        files: ^data/|\.npz$|\.pkl$
